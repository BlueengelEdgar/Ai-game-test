
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的第一个AI网页程序</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f4f8;
      font-family: sans-serif;
    }
    main { text-align: center; }
    #count {
      font-size: 90px;
      font-weight: bold;
      margin: 20px;
    }
    button {
      padding: 16px 32px;
      font-size: 24px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h2>我的第一个AI网页程序</h2>
    <div id="count">0</div>
    <button id="add">点击加1</button>
  </main>
  <script>
    let count = 0;
    document.getElementById("add").onclick = function() {
      count++;
      document.getElementById("count").textContent = count;
    };
  </script>
</body>
</html>
